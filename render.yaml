services:
  - type: web
    name: industrial-slab-workbench-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SLAB_MODE
        value: public
      - key: SLAB_DATA_DIR
        value: /tmp/slab-runtime
      - key: SLAB_ALLOWED_ORIGINS
        value: https://corookie.github.io
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
